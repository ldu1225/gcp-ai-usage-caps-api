# GCP AI Usage & Spend Caps API - Default Configuration
# Override via config.local.yaml (git-ignored) or environment variables.

server:
  host: "127.0.0.1"
  port: 8080
  cache_ttl_seconds: 120

workspace:
  project_id: "your-gcp-project-id"
  projects: []
  scan_all_projects: true
  quota_project_id: ""
  timezone: "UTC"
  default_range_days: 14
  audit_dataset: "ge_analytics"
  audit_project: ""
  scope_type: "projects"          # projects | folder | organization
  scope_ids: []
  scope_max_projects: 300
  scope_filter: "none"            # none | gemini_enterprise
  discovery_engine_locations:
    - "global"
  billing:
    account_id: ""                # only for project hard spend caps (Budget API); Billing Export is never used

storage:
  backend: "auto"                 # auto | gcs | file | memory
  file_path: "data"
  gcs_bucket: ""
  gcs_prefix: "gcp-ai-usage-caps-api"

bigquery:
  max_bytes_billed: 20000000000

auth:
  public_base_url: ""
  oidc_allowed_service_accounts: []
  oidc_default_scopes:
    - "usage:read"
    - "caps:read"
    - "caps:write"
  allow_local_insecure: false

caps:
  usage_source: "auto"            # auto | bigquery | logging
  inference_log: "businessaicode.googleapis.com%2Finference_response"
  vertex_inference_log: "aiplatform.googleapis.com%2Finference_request"   # Vertex AI token source (enable per project)
  vertex_user_header_label: "user"  # portal sends x-goog-agent-platform-observability-label-user: <email|uid>
  vertex_logging_endpoint: "https://aiplatform.googleapis.com/v1beta1"
  cap_scope: "total"              # total (one cap across all projects) | per_project (cap applies in each project)
  project_defaults: {}            # {project_id: {cost_cap, token_cap, request_cap}} per-user cap inside one project
  metered_surfaces: ["antigravity", "vertex_ai", "gemini_enterprise"]
  audit_log_name: "gcp-ai-usage-caps-audit"
  max_log_entries: 20000
  enforcement_mode: "manual"      # manual | auto
  enforcement_backend: "iam_deny" # iam_deny | notify_only
  deny_policy_id: "gcp-ai-caps-managed"
  deny_attachment: "projects"     # projects | scope
  default_block_services:
    - "antigravity"
    - "vertex_ai"
    - "gemini_enterprise"
  period: "monthly"               # daily | weekly | monthly | custom | all
  window: "calendar"              # calendar | rolling
  reset_timezone: ""
  reset_weekday: 0                # 0 = Monday
  reset_day: 1                    # 1-31
  reset_time: "00:00"
  cycle_days: 30
  cycle_start: ""
  cost_cap: 0.0
  token_cap: 0
  request_cap: 0
  currency: "USD"
  webhook_thresholds:
    - 80
    - 100
  change_budget_min: 10
  change_budget_ratio: 0.2
  surge_guard_min: 10
  surge_guard_ratio: 0.5
  spend_caps_enabled: false
  enforcement_job: ""
  usage_events_subscription: ""
  credit_per_user_month: 10.0
  credit_model_prefixes:
    - "gemini"
  chargeback_allocation_mode: "credit_share"  # credit_share | list

pricing:
  source: "auto"                  # auto | manual
  currency: "USD"
  input_price_per_million: 0.0
  output_price_per_million: 0.0
  model_overrides: []
  model_aliases: []
  catalog_services:
    - "Vertex AI"
    - "Agent Platform"
    - "Gemini API"
    - "Generative Language"
  include_partner_models: true
  excluded_sku_patterns:
    - "code assist"
    - "duet ai"
  fx_sources:
    - "https://open.er-api.com/v6/latest/USD"
  long_context_threshold_tokens: 200000   # prompts above this use the long-context SKU tier (align with the threshold shown in GET /v1/pricing)
  provisioned_throughput_cost: "on_demand" # on_demand (price PT tokens at on-demand SKU) | zero (prepaid commitment)

# Central (hub) deployment facts — filled by scripts/deploy.sh via environment variables.
hub:
  region: "asia-northeast3"
  service_name: "gcp-ai-usage-caps-api"
  runtime_service_account: ""
  enforcer_service_account: ""
  org_id: ""
  vpc_network: ""
  vpc_subnet: ""
  vpc_egress: ""
  usage_events_topic: ""

# Model governance (Org Policy vertexai.allowedModels, Gemini Enterprise app models, per-user model rules)
models:
  violation_action: "block_service"   # block_service (default: block first, always notify) | notify
  violation_block_minutes: 0          # 0 = model violations stay blocked until POST /v1/users/{email}/unblock
  violation_notify: true
  violation_block_scope: "project"    # project (block only where the violation happened) | all (every managed project)
  policy_scopes: ["projects"]         # projects | folders | organizations (writes need org-level roles/orgpolicy.policyAdmin)
  allow_org_policy_writes: true
  default_actions: ["predict"]        # predict | deploy | tune
  always_allow: ["publishers/anthropic/models/count-tokens"]
  # Model Garden publishers (vendors) to scan - NOT a model list. Models are discovered live and every model /
  # publisher seen in usage logs is added automatically (GET /v1/models?source=observed).
  publishers: ["google", "anthropic", "meta", "mistralai", "ai21", "deepseek-ai", "qwen", "openai"]
  catalog_ttl_seconds: 3600
  max_policy_values: 500
  protected_principals: []            # e.g. ["ceo@company.com", "*@breakglass.company.com"] -> notify only
  managed_folders: []
  lifecycle_overrides: []             # [{model, deprecation_date, shutdown_date, replacement}]

# Rate limits & quota requests (Cloud Quotas API)
quotas:
  service: "aiplatform.googleapis.com"
  contact_email: ""                   # default contact for quota increase requests
  headroom_warn_pct: 80
  max_projects_per_call: 50

readiness:
  cache_ttl_seconds: 900
  strict: true
