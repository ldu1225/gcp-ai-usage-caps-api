        members: { type: array, items: { type: object } }
        period: { type: object }

    DateRangeMeta:
      type: object
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        granularity: { type: string, enum: [day, week] }
        timezone: { type: string }

    UserUsage:
      type: object
      properties:
        email: { type: string }
        uid: { type: string }
        surfaces:
          type: array
