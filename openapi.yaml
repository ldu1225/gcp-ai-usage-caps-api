openapi: 3.1.0
info:
  title: GCP AI Usage & Spend Caps API
  version: 1.3.0
  description: |
    Headless M2M REST API for enterprise AI management portals to query per-user Google Cloud AI
    usage & estimated costs (Antigravity, Gemini Platform - Gemini Enterprise Agent Platform, formerly Gemini Platform -,
    Gemini Enterprise) and
    enforce user-level and project-level Spend Caps via IAM Deny v2 and Cloud Billing Spend Caps.

    ### Authentication
    - **Scoped API Key**: `Authorization: Bearer gcpai_<id>_<secret>` (salted SHA-256 hashed at rest).
      Scopes: `usage:read`, `caps:read`, `caps:write`, `users:write`, `models:read`, `models:write`,
      `quotas:read`, `quotas:write`, `admin` (admin implies all).
    - **GCP Service Account OIDC**: `Authorization: Bearer <RS256 Google OIDC ID Token>` with
      audience matching `PUBLIC_BASE_URL` (used by Cloud Scheduler, Pub/Sub push, and internal GCP callers).

    ### Operational Notes (differences from other AI vendor admin APIs)
    - **IAM Deny v2 Propagation**: Block/unblock changes are eventually consistent and typically
      take **1-2 minutes** to propagate across Google Cloud (requests already in flight complete).
    - **Cost Measurement (no Billing Export)**: per-user cost = token counts from logs (Antigravity
      inference logs, Gemini Platform inference request metadata logs, Gemini Enterprise activity) x official
      Cloud Billing Catalog SKU prices (input / output incl. thinking / cached / cache-write, long-context,
      Flex / Priority / Batch tiers) or contract overrides. The Cloud Billing export is never read; amounts
      are list-price estimates (credits, CUDs and taxes excluded). See `GET /v1/pricing`.
    - **Gemini Platform per-user attribution**: Gemini Platform (formerly Gemini Platform) inference logs carry only a service-account principal.
      Portals should send the header `x-goog-agent-platform-observability-label-user: <email|uid>`; otherwise
      tokens are split across same-minute Data Access audit callers, and anything left is reported as
      project-level `unattributed` usage (never dropped).
    - **Dynamic models**: there is no built-in model list. `GET /v1/models` = live Model Garden + every model
      observed in logs; new models trigger the `model.first_seen` webhook.
    - **Groups**: groups have the same capabilities as users (caps per member or as a shared pool, block,
      exceptions, model rules, usage). Resolution order: user > group (priority) > global policy.
    - **Multi-project users**: usage, caps (`cap_scope`, `project_caps`, `project_defaults`) and blocks
      (`projects: [...]`) work per (user, project); one hub governs every managed project.
    - **Project Spend Cap Lift**: Lifting an `ENFORCED` Google Cloud Billing Spend Cap takes up to
      **~1 hour** for Google Cloud to resume Agent Platform traffic.

servers:
  - url: https://your-api-service.run.app
    description: Cloud Run deployment URL

security:
  - BearerApiKey: []
  - GoogleOidcBearer: []

tags:
  - name: System
  - name: Usage & Billing
  - name: Spend Caps
  - name: User Block / Unblock
  - name: Groups
    description: Groups are policy subjects with the same capabilities as users (caps, blocks, exceptions, model rules, usage).
  - name: Project Spend Caps
  - name: Audit
  - name: Internal
  - name: Admin
  - name: Models
  - name: Model Access
  - name: Surface Models
  - name: Model Rules
  - name: Rate Limits & Quotas
  - name: Operations
  - name: Readiness

paths:
  /v1/health:
    get:
      tags: [System]
      summary: Health & readiness check
      description: Returns basic liveness without auth, and storage/enforcement details when authenticated.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: gcp-ai-usage-caps-api }
                  version: { type: string, example: 1.0.0 }
                  timestamp: { type: string, format: date-time }

  /v1/openapi.yaml:
    get:
      tags: [System]
      summary: Download OpenAPI 3.1 specification
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /v1/usage/users:
    get:
      tags: [Usage & Billing]
      summary: List per-user AI usage and estimated cost
      description: Requires scope `usage:read`.
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date, example: "2026-11-01" }
        - name: end
          in: query
          schema: { type: string, format: date, example: "2026-11-26" }
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week], default: day }
        - name: project
          in: query
          schema: { type: string, description: "Filter by GCP project ID or 'all'" }
        - name: surface
          in: query
          schema: { type: string, enum: [all, antigravity, gemini_platform, gemini_enterprise] }
        - name: email
          in: query
          schema: { type: string, description: "Exact email or Workforce Identity principal" }
        - name: model
          in: query
          schema: { type: string, description: "Only users who used this exact model id" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of per-user usage records
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserUsage" }
                  has_more: { type: boolean }
                  next_cursor: { type: ["string", "null"] }
                  total: { type: integer }
                  currency: { type: string }
                  range: { $ref: "#/components/schemas/DateRangeMeta" }
                  summary:
                    type: object
                    properties:
                      active_users: { type: integer }
                      multi_project_users: { type: integer }
                      total_requests: { type: integer }
                      total_tokens: { type: integer }
                      total_estimated_cost: { type: ["number", "null"] }
                      unattributed_requests: { type: integer }
                      unattributed_tokens: { type: integer }
                      unattributed_estimated_cost: { type: ["number", "null"] }
                  pricing_source: { $ref: "#/components/schemas/PricingSource" }
                  telemetry: { $ref: "#/components/schemas/Telemetry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/usage/users/{email}:
    get:
      tags: [Usage & Billing]
      summary: Get detailed usage, time series, and current cap burn rate for one user
      description: Requires scope `usage:read`.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week], default: day }
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: User usage details, time series, and active cap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [user_usage] }
                  range: { $ref: "#/components/schemas/DateRangeMeta" }
                  user: { $ref: "#/components/schemas/UserUsage" }
                  timeseries:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        requests: { type: integer }
                        total_tokens: { type: integer }
                  current_cap: { $ref: "#/components/schemas/UserCap" }
                  telemetry: { $ref: "#/components/schemas/Telemetry" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/billing/users:
    get:
      tags: [Usage & Billing]
      summary: Monthly user & project chargeback report
      description: |
        Requires scope `usage:read`. Log token counts x official SKU prices (no Billing Export). One fact per
        (user, project) - users assigned to several projects are split per project. Uses integer-cent exact
        allocation (largest remainder) so per-user, per-project, and grand totals always agree to the cent.
        Gemini Platform usage without a person is listed per project under `unattributed`.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", example: "2026-11" }
        - name: project
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Monthly chargeback report
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  month: { type: string }
                  currency: { type: string }
                  allocation_mode: { type: string, enum: [credit_share, list] }
                  complete: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserBillingRow" }
                  by_project:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectBillingRow" }
                  totals: { type: object }
                  unattributed: { type: array, items: { type: object } }
                  pricing_source: { $ref: "#/components/schemas/PricingSource" }
                  telemetry: { $ref: "#/components/schemas/Telemetry" }
                  has_more: { type: boolean }
                  next_cursor: { type: ["string", "null"] }
                  total: { type: integer }

  /v1/caps/policy:
    get:
      tags: [Spend Caps]
      summary: Get global default spend cap policy
      description: Requires scope `caps:read`.
      responses:
        "200":
          description: Current global spend cap policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapPolicy" }
    put:
      tags: [Spend Caps]
      summary: Update global default spend cap policy
      description: Requires scope `caps:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapPolicyUpdate" }
      responses:
        "200":
          description: Updated global spend cap policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapPolicy" }

  /v1/caps/users:
    get:
      tags: [Spend Caps]
      summary: List per-user spend cap limits, usage, utilization%, and status
      description: Requires scope `caps:read`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, over_cap, suspended, blocked] }
        - name: email
          in: query
          schema: { type: string }
        - name: project
          in: query
          schema: { type: string, description: "Only users with usage, caps or blocks in this managed project" }
        - name: multi_project
          in: query
          schema: { type: boolean, description: "Only users active in more than one project" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated per-user spend cap status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserCap" }
                  has_more: { type: boolean }
                  next_cursor: { type: ["string", "null"] }
                  total: { type: integer }
                  period: { type: object }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      over_cap: { type: integer }
                      suspended: { type: integer }
                      blocked: { type: integer }

  /v1/caps/users/{email}:
    get:
      tags: [Spend Caps]
      summary: Get spend cap status for a specific user
      description: Requires scope `caps:read`.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User cap status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCap" }
    put:
      tags: [Spend Caps]
      summary: Set individual spend cap or allow/block override for a user
      description: Requires scope `caps:write`.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [limit, allow, block], default: limit }
                cost_cap: { type: number, minimum: 0 }
                token_cap: { type: integer, minimum: 0 }
                request_cap: { type: integer, minimum: 0 }
                scope:
                  type: string
                  enum: [total, per_project]
                  description: "total = one cap across all projects; per_project = the cap applies in each project"
                project_caps:
                  type: object
                  description: "Per-project caps for this user {project_id: {cost_cap, token_cap, request_cap}}"
                  additionalProperties: { $ref: "#/components/schemas/CapTriplet" }
                projects:
                  type: array
                  items: { type: string }
                  description: "type=block only - block only in these managed projects (omit = all)"
                services:
                  type: array
                  items: { type: string, enum: [antigravity, gemini_platform, gemini_enterprise] }
                until: { type: ["string", "null"], format: date-time }
                note: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Saved individual user cap rule
    delete:
      tags: [Spend Caps]
      summary: Remove individual spend cap override (revert to global policy)
      description: Requires scope `caps:write`.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rule deleted
        "404": { $ref: "#/components/responses/Error" }

  /v1/users/{email}/block:
    post:
      tags: [User Block / Unblock]
      summary: Immediately block a user on selected Google Cloud AI services
      description: Requires scope `users:write`. Updates IAM Deny v2 policy (or triggers Enforcer Job).
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items: { type: string, enum: [antigravity, gemini_platform, gemini_enterprise] }
                  default: [antigravity, gemini_platform, gemini_enterprise]
                projects:
                  type: array
                  items: { type: string }
                  description: "Block only in these managed projects (user assigned to several projects). Omit = all."
                reason: { type: string, maxLength: 200 }
                until: { type: ["string", "null"], format: date-time }
      responses:
        "200":
          description: User block recorded and enforced

  /v1/users/{email}/unblock:
    post:
      tags: [User Block / Unblock]
      summary: Immediately unblock a user on selected or all AI services
      description: Requires scope `users:write`.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items: { type: string, enum: [antigravity, gemini_platform, gemini_enterprise] }
                  description: "Omit to unblock across all services"
                projects:
                  type: array
                  items: { type: string }
                  description: "Unblock only in these managed projects (the block stays in the others)"
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: User unblocked

  /v1/caps/enforce:
    post:
      tags: [Spend Caps]
      summary: Evaluate spend cap policy (G1-G7 safety gates) and enforce blocks/restores
      description: "Requires scope `caps:write` or authorized OIDC Service Account. Defaults to `dryRun: true`."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun: { type: boolean, default: true }
      responses:
        "200":
          description: Enforcement run outcome including safety gates G1-G7 and execution plan

  # ---------------------------------------------------------------------------
  # Groups: first-class policy subjects (same capabilities as users)
  # ---------------------------------------------------------------------------
  /v1/groups:
    get:
      tags: [Groups]
      summary: List groups (ordered by priority)
      description: |
        Requires `caps:read` or `users:write`. A group is a set of people: explicit `members` plus members synced
        from a Google Group (`google_group`, Cloud Identity API), minus `excluded` people. Policy resolution order is
        user rule > group rule (lowest `priority`, then id) > global policy / default rule.
      parameters:
        - { name: member, in: query, schema: { type: string }, description: Only groups whose effective members include this person }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ListEnvelope" }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      tags: [Groups]
      summary: Create a group
      description: Requires `users:write`. When `google_group` is set, members are synced immediately and hourly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201": { description: Created group, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/groups/{group_id}:
    get:
      tags: [Groups]
      summary: Get a group with its cap rule, block and model rule
      description: Requires `caps:read` or `users:write`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Group, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Groups]
      summary: Update group attributes (members / excluded replace the whole list)
      description: |
        Requires `users:write`. Membership changes are applied to IAM Deny immediately when the group carries an
        enforced policy (block, block/allow rule or shared pool): removed members are restored, new members blocked.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200": { description: Updated group, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Groups]
      summary: Delete a group and every group policy (caps, block, model rule)
      description: Requires `users:write`. Group-derived blocks and pool suspensions are lifted for all members.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/groups/{group_id}/members:
    post:
      tags: [Groups]
      summary: Add or remove explicit members
      description: Requires `users:write`. Emits `group.membership_changed`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeopleDelta" }
      responses:
        "200": { description: "Updated group incl. effective_added, effective_removed and enforcement" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/groups/{group_id}/exclusions:
    post:
      tags: [Groups]
      summary: Add or remove exceptions (people the group policy never applies to)
      description: |
        Requires `users:write`. Excluded people are removed from the effective membership even if they are explicit
        members or members of the synced Google Group. Excluding a blocked or pool-suspended member restores access
        immediately (the person's own user-level blocks and caps still apply).
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeopleDelta" }
      responses:
        "200": { description: Updated group }

  /v1/groups/{group_id}/sync:
    post:
      tags: [Groups]
      summary: Sync members from the linked Google Group now
      description: |
        Requires `users:write`. Uses Cloud Identity `groups:lookup` and `memberships:searchTransitiveMemberships`
        (nested groups resolved; service accounts ignored). Needs the Cloud Identity API and the runtime service
        account in the Google Workspace "Groups Reader" admin role. Runs hourly in the governance cycle.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: boolean }
                  members: { type: integer }
                  added: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
                  error: { type: string }
                  hint: { type: string }

  /v1/groups/{group_id}/block:
    post:
      tags: [Groups]
      summary: Block every effective member (IAM Deny v2)
      description: |
        Requires `users:write`. Applies to all managed projects or only `projects`. Members with a user-level `allow`
        rule are not affected; members with their own block keep it. New members are blocked as soon as they join.
        Changes propagate within ~1-2 minutes. Emits `group.blocked`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                services: { type: array, items: { $ref: "#/components/schemas/Surface" } }
                projects: { type: array, items: { type: string } }
                reason: { type: string, maxLength: 200 }
                until: { type: ["string", "null"], format: date-time }
      responses:
        "200":
          description: Group block applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [group_block] }
                  group: { type: string }
                  members_blocked: { type: array, items: { type: string } }
                  members_not_affected: { type: array, items: { type: string } }
                  enforcement: { type: object }

  /v1/groups/{group_id}/unblock:
    post:
      tags: [Groups]
      summary: Lift the group block (and a type=block group cap rule)
      description: |
        Requires `users:write`. Members are restored unless they still have their own block, another group's block
        or an active personal suspension (`members_still_blocked`). Emits `group.unblocked`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200": { description: Group unblocked }

  /v1/groups/{group_id}/model-rules:
    get:
      tags: [Groups, Model Rules]
      summary: Get the group model rule
      description: Requires `models:read`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Group model rule (null when none) }
    put:
      tags: [Groups, Model Rules]
      summary: Set the group model rule (allow/deny list, per-model limits, on_violation)
      description: |
        Requires `models:write`. Same body as `PUT /v1/users/{email}/model-rules`. Resolution: user rule > group rule
        (priority) > default rule; `mode: inherit` keeps the base list and overrides only limits and actions.
        Violations by members are blocked (default) and always notified via `user.model_violation`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Saved group model rule }
    delete:
      tags: [Groups, Model Rules]
      summary: Delete the group model rule
      description: Requires `models:write`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/caps/groups:
    get:
      tags: [Groups, Spend Caps]
      summary: List group spend caps with pooled usage, utilization and member status counts
      description: Requires `caps:read`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Group caps
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ListEnvelope" }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/GroupCap" } }

  /v1/caps/groups/{group_id}:
    get:
      tags: [Groups, Spend Caps]
      summary: Get one group's spend cap status
      description: Requires `caps:read`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Group cap, content: { application/json: { schema: { $ref: "#/components/schemas/GroupCap" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Groups, Spend Caps]
      summary: Set the group spend cap (per-member or shared pool) or an allow/block override
      description: |
        Requires `caps:write`.
        - `pool: per_member` - every member without a user rule gets this cap individually.
        - `pool: shared` - one budget for the pooled usage of all effective members; when it is reached every member
          (except user-level `allow`) is suspended in all managed projects (`scope: total`) or only in the over-cap
          projects (`scope: per_project` / `project_caps`). Each member's own cap still applies in addition.
        - `type: allow` / `type: block` - group-wide override (a user rule still wins).
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCapRule" }
      responses:
        "200": { description: Saved group cap rule }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Groups, Spend Caps]
      summary: Remove the group spend cap (members fall back to their own rule or the global policy)
      description: Requires `caps:write`.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/usage/groups:
    get:
      tags: [Groups, Usage & Billing]
      summary: Usage and estimated cost rolled up per group
      description: Requires `usage:read`. Same counters, model / surface / project breakdown as `/v1/usage/users`.
      parameters:
        - { $ref: "#/components/parameters/Start" }
        - { $ref: "#/components/parameters/End" }
        - { name: surface, in: query, schema: { type: string, enum: [all, antigravity, gemini_platform, gemini_enterprise] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Group usage rows }

  /v1/usage/groups/{group_id}:
    get:
      tags: [Groups, Usage & Billing]
      summary: Usage of one group with per-member ranking and daily time series
      description: Requires `usage:read`.
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/Start" }
        - { $ref: "#/components/parameters/End" }
        - { name: surface, in: query, schema: { type: string } }
      responses:
        "200": { description: Group usage }
        "404": { $ref: "#/components/responses/Error" }

  /v1/users/{email}/groups:
    get:
      tags: [Groups]
      summary: Groups of a person and the resulting policy sources
      description: |
        Requires `usage:read` or `caps:read`. Returns effective groups (priority order), groups the person is
        excluded from, and which subject currently drives the cap rule, block and model rule
        (`user`, `group:<id>`, `policy` / `default`).
      parameters: [{ $ref: "#/components/parameters/Email" }]
      responses:
        "200": { description: User groups }

  /v1/caps/projects:
    get:
      tags: [Project Spend Caps]
      summary: List project-level spend cap configs and Cloud Billing Spend Cap states
      description: Requires scope `caps:read`.
      responses:
        "200":
          description: Project spend cap status list

  /v1/caps/projects/{project_id}:
    put:
      tags: [Project Spend Caps]
      summary: Configure and optionally apply a monthly USD project spend cap
      description: Requires scope `caps:write`. Uses Cloud Billing Budget API v1 spendCap for Agent Platform.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthly_usd]
              properties:
                monthly_usd: { type: number, minimum: 0 }
                action: { type: string, enum: [hard_cap, notify], default: hard_cap }
                apply: { type: boolean, default: true }
                dryRun: { type: boolean, default: false }
      responses:
        "200":
          description: Project spend cap saved and applied/planned

  /v1/caps/projects/{project_id}/lift:
    post:
      tags: [Project Spend Caps]
      summary: Lift an ENFORCED Google Cloud project spend cap for the remainder of the month
      description: Requires scope `caps:write`. Sets `spendCap.inputState = AWAITING_NEXT_PERIOD`.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Spend cap lift status

  /v1/audit-logs:
    get:
      tags: [Audit]
      summary: Query API governance & block/unblock audit trail
      description: Requires scope `caps:read` or `admin`.
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: target
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated audit entries

  /v1/internal/usage-event:
    post:
      tags: [Internal]
      summary: Pub/Sub push receiver for real-time inference log events
      description: Authenticated via Google OIDC Bearer token from Pub/Sub push subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: object
                  properties:
                    data: { type: string, description: "Base64-encoded Cloud Logging JSON entry" }
                subscription: { type: string }
      responses:
        "200":
          description: Event acknowledged
        "503":
          description: Temporary throttle; Pub/Sub retries delivery

  /v1/internal/pricing/sync:
    post:
      tags: [Internal]
      summary: Sync official Cloud Billing Catalog token prices & FX rates
      description: Requires OIDC scheduler SA or `admin` scope.
      responses:
        "200":
          description: Pricing sync summary

  /v1/admin/api-keys:
    get:
      tags: [Admin]
      summary: List scoped M2M API keys (metadata only)
      description: Requires scope `admin`.
      responses:
        "200":
          description: List of API key records (never contains plaintext secrets)
    post:
      tags: [Admin]
      summary: Issue a new scoped M2M API key (plaintext returned once)
      description: Requires scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 120 }
                scopes:
                  type: array
                  items: { type: string, enum: [usage:read, caps:read, caps:write, users:write, admin] }
                expires_at: { type: ["string", "null"], format: date-time }
      responses:
        "201":
          description: Newly created API key (save the `key` field immediately)

  /v1/admin/api-keys/{key_id}:
    delete:
      tags: [Admin]
      summary: Revoke an API key immediately
      description: Requires scope `admin`.
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: API key revoked

  /v1/admin/webhooks:
    get:
      tags: [Admin]
      summary: List configured outbound webhooks
      description: Requires scope `admin`.
      responses:
        "200":
          description: List of outbound webhooks (without signing secret)
    post:
      tags: [Admin]
      summary: Register a signed outbound webhook
      description: Requires scope `admin`. Returns `secret` once for verifying `X-Signature-256`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - cap.threshold_reached
                      - cap.exceeded
                      - user.blocked
                      - user.unblocked
                      - project_cap.enforced
                      - project_cap.lifted
                      - model.access_changed
                      - model.lifecycle_notice
                      - model.first_seen
                      - model.catalog_changed
                      - user.model_violation
                      - rate_limit.threshold_reached
                      - quota_request.created
                      - quota_request.updated
                      - readiness.degraded
                      - group.cap_threshold_reached
                      - group.cap_exceeded
                      - group.blocked
                      - group.unblocked
                      - group.membership_changed
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Webhook registered

  /v1/admin/webhooks/{webhook_id}:
    delete:
      tags: [Admin]
      summary: Delete an outbound webhook
      description: Requires scope `admin`.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Webhook deleted

  # ===========================================================================
  # Models (catalog, usage, access decision)
  # ===========================================================================
  /v1/models:
    get:
      tags: [Models]
      summary: List models (dynamic model catalog)
      description: |
        Requires `models:read`. No built-in model list: catalog = live Gemini Platform Model Garden discovery (configured
        publishers + every publisher seen in logs; delisted models kept with `delisted_at`) + every model observed in
        usage logs on any surface (`source=observed`, with first/last seen, surfaces, projects, users) + official SKU
        pricing + lifecycle. `include=access` adds the per-surface access decision for `project`; `include=usage`
        adds live 30-day usage.
      parameters:
        - { name: publisher, in: query, schema: { type: string }, example: anthropic }
        - { name: surface, in: query, schema: { type: string, enum: [gemini_platform, gemini_enterprise, antigravity] } }
        - { name: stage, in: query, schema: { type: string, enum: [ga, preview, private_preview, experimental, deprecated] } }
        - { name: q, in: query, schema: { type: string }, description: Substring search on id / display name }
        - { name: include, in: query, schema: { type: string }, example: "access,usage" }
        - { name: project, in: query, schema: { type: string }, description: Project for include=access (default hub) }
        - { name: source, in: query, schema: { type: string, enum: [model_garden, observed] } }
        - { name: used, in: query, schema: { type: boolean }, description: Only models observed in usage logs }
        - { name: include_helpers, in: query, schema: { type: boolean } }
        - { name: refresh, in: query, schema: { type: boolean }, description: Force Model Garden re-discovery }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Model" } }
                      catalog: { type: object, properties: { fetched_at: { type: [string, "null"] }, errors: { type: object }, publishers: { type: array, items: { type: string } }, model_garden_models: { type: integer }, observed_only_models: { type: integer } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/models/sync:
    post:
      tags: [Models]
      summary: Refresh the Model Garden catalog now
      description: Requires `models:write`. Also runs automatically (catalog TTL, hourly reconcile).
      responses:
        "200": { description: Sync summary, content: { application/json: { schema: { type: object, properties: { discovered: { type: integer }, publishers: { type: array, items: { type: string } }, errors: { type: object }, fetched_at: { type: string }, added: { type: array, items: { type: string } }, delisted: { type: array, items: { type: string } } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/models/{model_id}:
    get:
      tags: [Models]
      summary: Retrieve a model with access decisions for every managed project
      description: |
        Requires `models:read`. `model_id` is a Model Garden / log model id (see `GET /v1/models`); pass
        `?publisher=` when ambiguous. `access_by_project` shows Gemini Platform (Org Policy), Gemini Enterprise (per app)
        and Antigravity (per location, read-only) decisions.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - { name: publisher, in: query, schema: { type: string } }
      responses:
        "200": { description: Model, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/models/{model_id}/access:
    get:
      tags: [Models]
      summary: Explain who can use a model (projects, GE apps, per-user rules)
      description: Requires `models:read`.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200": { description: Access decision trace, content: { application/json: { schema: { type: object, properties: { object: { type: string, enum: [model_access] }, model: { type: string }, publisher: { type: string }, projects: { type: object, additionalProperties: { $ref: "#/components/schemas/ModelAccessDecision" } }, user_rules: { type: array, items: { type: object } } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/usage/models:
    get:
      tags: [Models, Usage & Billing]
      summary: Usage and estimated cost per model
      description: |
        Requires `usage:read` or `models:read`. Every model seen in any log is listed (including models not in Model
        Garden, `catalog_status=observed_only`). Optional `group_by=user|project|surface|traffic` breakdown;
        unattributed Gemini Platform usage is included per model.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - { name: granularity, in: query, schema: { type: string, enum: [day, week] } }
        - { name: surface, in: query, schema: { type: string, enum: [all, antigravity, gemini_platform, gemini_enterprise] } }
        - { name: project, in: query, schema: { type: string } }
        - { name: group_by, in: query, schema: { type: string, enum: [user, project, surface, traffic] } }
        - { name: model, in: query, schema: { type: string }, description: Model id or pattern }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Page of per-model usage rows, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }, range: { $ref: "#/components/schemas/DateRangeMeta" } } } ] } } } }
        default: { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Model access policies (Gemini Platform Model Garden via Org Policy vertexai.allowedModels)
  # ===========================================================================
  /v1/model-access:
    get:
      tags: [Model Access]
      summary: List model access policies of every managed scope
      description: Requires `models:read`. One entry per managed project (+ configured folders/organization).
      parameters:
        - { name: scope_type, in: query, schema: { type: string, enum: [projects, folders, organizations] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Page of policies, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ModelAccessPolicy" } } } } ] } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/bulk-apply:
    post:
      tags: [Model Access]
      summary: Apply one model policy to many scopes (e.g. every managed project)
      description: Requires `models:write`. `scopes` accepts `projects/*` (all managed projects) and explicit scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ModelAccessPolicyInput"
                - type: object
                  properties:
                    scopes: { type: array, items: { type: string }, example: ["projects/*"] }
      responses:
        "200": { description: Per-scope results, content: { application/json: { schema: { $ref: "#/components/schemas/BulkResult" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/reconcile:
    post:
      tags: [Model Access]
      summary: Re-expand stored patterns (new model versions) and fix drift
      description: Requires `models:write`. Also runs hourly from the scheduled enforcer.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { dryRun: { type: boolean, default: false } } } } }
      responses:
        "200": { description: Reconcile results }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/{scope_type}/{scope_id}:
    get:
      tags: [Model Access]
      summary: Get the policy, effective (inherited) policy, stored intent and drift for a scope
      description: Requires `models:read`.
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200": { description: Policy, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessPolicy" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Model Access]
      summary: Set the model access policy (allow_list / deny_list / unrestricted / deny_all / inherit)
      description: |
        Requires `models:write`. Patterns (`<family>-*`, `anthropic/*`) are expanded against the catalog
        (Org Policy has no wildcards, max 500 values). Safety: `dryRun`, impact preview, lockout prevention
        (`force` required for empty allow lists / deny_all), optimistic concurrency with `If-Match: <etag>`.
        Returns an `operation` (Org Policy changes usually take effect within minutes, up to ~15).
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessPolicyInput" } } }
      responses:
        "200": { description: Change result, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessChange" } } } }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Model Access]
      summary: Remove the policy (scope inherits from its parent)
      description: Requires `models:write`. Supports `?dryRun=true`.
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
        - { name: dryRun, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Change result, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessChange" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/{scope_type}/{scope_id}/preview:
    post:
      tags: [Model Access]
      summary: Preview the impact of a policy (users/models that would be blocked) without writing
      description: Requires `models:read`.
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessPolicyInput" } } }
      responses:
        "200": { description: Dry-run change incl. impact, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessChange" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/{scope_type}/{scope_id}/models/{model_id}/allow:
    post:
      tags: [Model Access]
      summary: Allow one model (lift a restriction)
      description: Requires `models:write`. Adds to allow lists / removes from deny lists. 409 when denied by a pattern or by a parent policy.
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelToggleInput" } } }
      responses:
        "200": { description: Change result, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessChange" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-access/{scope_type}/{scope_id}/models/{model_id}/restrict:
    post:
      tags: [Model Access]
      summary: Restrict one model
      description: Requires `models:write`. Removes from allow lists / adds to deny lists (creates a deny_list when unrestricted).
      parameters:
        - $ref: "#/components/parameters/ScopeType"
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelToggleInput" } } }
      responses:
        "200": { description: Change result, content: { application/json: { schema: { $ref: "#/components/schemas/ModelAccessChange" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Surface model controls
  # ===========================================================================
  /v1/gemini-enterprise/apps:
    get:
      tags: [Surface Models]
      summary: List Gemini Enterprise apps and their model selection across managed projects
      description: Requires `models:read`. Projects without an app report `status=not_applicable`.
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Apps, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/GeminiEnterpriseApp" } }, projects: { type: object } } } ] } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/gemini-enterprise/apps/bulk-models:
    post:
      tags: [Surface Models]
      summary: Turn models on/off in many (or all `*`) Gemini Enterprise apps
      description: Requires `models:write`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [models], properties: { apps: { type: array, items: { type: string }, example: ["*"] }, models: { $ref: "#/components/schemas/GeModelStates" }, dryRun: { type: boolean } } } } }
      responses:
        "200": { description: Per-app results, content: { application/json: { schema: { $ref: "#/components/schemas/BulkResult" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/gemini-enterprise/apps/{app_id}/models:
    get:
      tags: [Surface Models]
      summary: Get one app's model selection
      description: Requires `models:read`. `app_id` = `PROJECT~LOCATION~ENGINE_ID`.
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200": { description: App models, content: { application/json: { schema: { $ref: "#/components/schemas/GeminiEnterpriseApp" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Surface Models]
      summary: Merge-update one app's model selection (on | off | default)
      description: Requires `models:write`. The engine is re-read and only listed keys change (console edits preserved).
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [models], properties: { models: { $ref: "#/components/schemas/GeModelStates" }, dryRun: { type: boolean } } } } }
      responses:
        "200": { description: Change result }
        default: { $ref: "#/components/responses/Error" }

  /v1/antigravity/models:
    get:
      tags: [Surface Models]
      summary: Antigravity authorized models per project/location (read-only)
      description: Requires `models:read`. `write_mode=console_required`; use per-user model rules for API enforcement.
      parameters:
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200": { description: Antigravity model configs }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Surface Models]
      summary: Always 409 console_required (Google restricts UpdateDevToolsConfig to the Cloud Console)
      description: Requires `models:write`. Explicit, documented behaviour so portals can deep-link the console.
      responses:
        "409": { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Per-user model rules
  # ===========================================================================
  /v1/model-rules:
    get:
      tags: [Model Rules]
      summary: List per-user model rules (plus the workspace default rule)
      description: Requires `models:read`.
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Rules }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-rules/default:
    get:
      tags: [Model Rules]
      summary: Get the default model rule applied to every user without an override
      description: Requires `models:read`.
      responses:
        "200": { description: Default rule, content: { application/json: { schema: { type: object, properties: { object: { type: string }, scope: { type: string }, rule: { $ref: "#/components/schemas/ModelRule" } } } } } }
    put:
      tags: [Model Rules]
      summary: Set the default model rule
      description: Requires `models:write`. Default `on_violation=block_service` (block first, always notify).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelRuleInput" } } }
      responses:
        "200": { description: Saved rule }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Model Rules]
      summary: Remove the default model rule
      description: Requires `models:write`.
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/model-rules/evaluate:
    post:
      tags: [Model Rules]
      summary: Evaluate model rules now (dry run by default)
      description: Requires `models:write`. Same evaluation the scheduled enforcer runs every 5 minutes.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { dryRun: { type: boolean, default: true } } } } }
      responses:
        "200": { description: Evaluation result incl. violations and blocks }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-violations:
    get:
      tags: [Model Rules]
      summary: List detected model rule violations
      description: Requires `models:read`.
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [model_not_allowed, model_denied, limit_exceeded] } }
        - { name: action, in: query, schema: { type: string, enum: [block_service, notify, deferred] } }
        - { name: surface, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Violations, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ModelViolation" } } } } ] } } } }

  /v1/users/{email}/model-rules:
    get:
      tags: [Model Rules]
      summary: A user's own rule, effective rule, today's per-model usage and recent violations
      description: Requires `models:read`.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200": { description: User model rules }
    put:
      tags: [Model Rules]
      summary: Set a user's model rule (overrides the default; mode=inherit keeps default models)
      description: Requires `models:write`.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelRuleInput" } } }
      responses:
        "200": { description: Saved rule }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Model Rules]
      summary: Remove a user's model rule
      description: Requires `models:write`.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Rate limits & quotas
  # ===========================================================================
  /v1/rate-limits:
    get:
      tags: [Rate Limits & Quotas]
      summary: Rate limits (RPM/TPM per model & region) with usage and headroom across managed projects
      description: Requires `quotas:read`. Source = Cloud Quotas API + Cloud Monitoring (24h peak).
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string }, description: "base_model dimension; `default` for rows without a model" }
        - { name: location, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string, enum: [requests_per_minute, tokens_per_minute, requests_per_day, tokens_per_day, other] } }
        - { name: near_limit, in: query, schema: { type: boolean }, description: "Only rows at/above quotas.headroom_warn_pct utilization" }
        - { name: all, in: query, schema: { type: boolean }, description: Include non generative-AI quotas }
        - { name: include_usage, in: query, schema: { type: boolean, default: true } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Rate limits, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/RateLimit" } }, errors: { type: object } } } ] } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/rate-limits/users/{email}:
    get:
      tags: [Rate Limits & Quotas]
      summary: Per-user per-model limits (RPM, TPM, daily/monthly requests, tokens, cost)
      description: Requires `quotas:read`. Alias of the `limits` slice of the user's model rule.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200": { description: User limits }
    put:
      tags: [Rate Limits & Quotas]
      summary: Set per-user per-model limits
      description: Requires `quotas:write`. Enforced by detection + IAM Deny block (RPM/TPM real-time; daily/monthly every 5 min).
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [limits], properties: { limits: { type: array, items: { $ref: "#/components/schemas/ModelLimit" } }, on_violation: { type: string, enum: [block_service, notify] }, block_minutes: { type: integer }, block_services: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Rate Limits & Quotas]
      summary: Remove per-user limits (default rule limits apply)
      description: Requires `quotas:write`.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{project_id}/rate-limits:
    get:
      tags: [Rate Limits & Quotas]
      summary: Rate limits of one project
      description: Requires `quotas:read`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: model, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
        - { name: all, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Rate limits }
        default: { $ref: "#/components/responses/Error" }

  /v1/projects/{project_id}/rate-limits/{limit_id}:
    get:
      tags: [Rate Limits & Quotas]
      summary: One rate limit
      description: Requires `quotas:read`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/LimitId"
      responses:
        "200": { description: Rate limit, content: { application/json: { schema: { $ref: "#/components/schemas/RateLimit" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Rate Limits & Quotas]
      summary: Change a rate limit (value <= current = cap/decrease; value > current = increase request)
      description: Requires `quotas:write`. Decreases below the observed 24h peak need `force=true`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/LimitId"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: integer, minimum: 0 }, justification: { type: string }, contact_email: { type: string, format: email }, force: { type: boolean }, dryRun: { type: boolean } } } } }
      responses:
        "200": { description: Quota request, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaRequest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/quota-requests:
    get:
      tags: [Rate Limits & Quotas]
      summary: List quota requests
      description: Requires `quotas:read`. `refresh=true` re-reads pending requests from Cloud Quotas.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, partially_approved, denied, applied, cancelled, failed] } }
        - { name: project, in: query, schema: { type: string } }
        - { name: refresh, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Quota requests, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/ListEnvelope" }, { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/QuotaRequest" } } } } ] } } } }
    post:
      tags: [Rate Limits & Quotas]
      summary: Submit a quota increase/decrease directly to Google Cloud (one project or many)
      description: |
        Requires `quotas:write`. Target with `limit_id`, or `quota_id` (+ `model`, `location`). Bulk with
        `projects: ["*"]`. Increases need `justification` (>=10 chars) and `contact_email`. Supports
        `Idempotency-Key` header and `dryRun`.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuotaRequestInput" } } }
      responses:
        "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaRequest" } } } }
        "200": { description: "Dry run, bulk result or idempotent replay" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/quota-requests/{request_id}:
    get:
      tags: [Rate Limits & Quotas]
      summary: Get a quota request (live status)
      description: Requires `quotas:read`.
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, pattern: "^qr_[0-9a-f]{16}$" } }
      responses:
        "200": { description: Quota request, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaRequest" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/quota-requests/{request_id}/cancel:
    post:
      tags: [Rate Limits & Quotas]
      summary: Cancel a pending request (restores the granted/previous value)
      description: Requires `quotas:write`.
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaRequest" } } } }
        "409": { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Environment readiness (preflight)
  # ===========================================================================
  /v1/admin/readiness:
    get:
      tags: [Readiness]
      summary: Environment readiness report for the hub and every managed project (cached)
      description: |
        Requires `admin`. Exhaustive checks: project/billing, APIs, organization policies (resource locations, domain
        restricted sharing, Cloud Run ingress/egress, CMEK, restricted services, vertexai.allowedModels), VPC Service
        Controls (incl. hub<->spoke cross-perimeter), network (PGA, NAT), BigQuery datasets/tables (adoption of existing
        ones), log sinks (incl. aggregated), Data Access audit logs, Gemini Enterprise / Antigravity / Gemini Platform
        presence, IAM permissions, IAM Deny capacity, Pub/Sub/Scheduler/Cloud Run, Cloud Quotas. Each check carries a
        bilingual title, impact and remediation commands; `remediation_script` aggregates every fix.
      parameters:
        - { name: refresh, in: query, schema: { type: boolean } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200": { description: Readiness report, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessReport" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/admin/readiness/run:
    post:
      tags: [Readiness]
      summary: Run readiness checks now (optionally for some projects / categories)
      description: "Requires `admin`. Categories: project, apis, orgpolicy, vpcsc, network, bigquery, logging, surfaces, iam, enforcement, quotas, config."
      requestBody:
        content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { type: string } }, categories: { type: array, items: { type: string, enum: [project, apis, orgpolicy, vpcsc, network, bigquery, logging, surfaces, iam, enforcement, quotas, config] } } } } } }
      responses:
        "200": { description: Readiness report, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessReport" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/projects/{project_id}/capabilities:
    get:
      tags: [Readiness]
      summary: What this control plane can do in one managed project
      description: |
        Requires `models:read`, `quotas:read` or `caps:read`. Per-surface availability (Gemini Platform, Gemini Enterprise
        apps, Antigravity), whether model policies / IAM Deny / Cloud Quotas are writable, and the effective
        `vertexai.allowedModels` policy. Served from the last readiness report or lightweight probes.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Capabilities, content: { application/json: { schema: { type: object, properties: { object: { type: string, enum: [capabilities] }, project_id: { type: string }, role: { type: string }, source: { type: string, enum: [cache, probe] }, gemini_platform: { type: object }, gemini_enterprise: { type: object }, antigravity: { type: object }, org_policy_writable: { type: [boolean, "null"] }, quotas_api: { type: [boolean, "null"] }, deny_writable: { type: [boolean, "null"] }, allowed_models_policy: { type: [object, "null"] } } } } } }
        "403": { $ref: "#/components/responses/Error" }

  # ===========================================================================
  # Operations
  # ===========================================================================
  /v1/users/{email}/projects:
    get:
      tags: [Usage & Billing, Spend Caps]
      summary: Every managed project a user works in (usage, cost, models, cap status, optional IAM bindings)
      description: |
        Requires `usage:read`. A user may be assigned to several projects (usually 1:1). Returns one row per project
        the user used in the range, has per-project caps / blocks in, or (with `include=iam`) is directly bound to
        via a `user:` IAM binding (group / inherited grants are not expanded).
      parameters:
        - { name: email, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - { name: include, in: query, schema: { type: string, enum: [iam] } }
      responses:
        "200":
          description: User projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [user_projects] }
                  email: { type: string }
                  uid: { type: string }
                  multi_project: { type: boolean }
                  currency: { type: string }
                  range: { $ref: "#/components/schemas/DateRangeMeta" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        project: { type: string }
                        managed: { type: boolean }
                        used: { type: boolean }
                        requests: { type: integer }
                        total_tokens: { type: integer }
                        estimated_cost: { type: ["number", "null"] }
                        models: { type: array, items: { type: object } }
                        cap: { type: object }
                        iam: { type: object, properties: { readable: { type: boolean }, roles: { type: array, items: { type: string } } } }
                  telemetry: { $ref: "#/components/schemas/Telemetry" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/pricing:
    get:
      tags: [Usage & Billing]
      summary: Official SKU price table used for cost estimates (no Billing Export)
      description: |
        Requires `usage:read` or `models:read`. Per model key: input / output / cached / cache_write prices per 1M tokens,
        long-context / flex / priority / batch tiers and the Cloud Billing Catalog SKU names they come from, plus
        contract overrides. Refreshed daily by `POST /v1/internal/pricing/sync`.
      parameters:
        - { name: model, in: query, schema: { type: string } }
      responses:
        "200":
          description: Price table
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [pricing_table] }
                  currency: { type: string }
                  unit: { type: string, enum: [per_1m_tokens] }
                  pricing_source: { $ref: "#/components/schemas/PricingSource" }
                  fx: { type: ["object", "null"] }
                  data: { type: array, items: { type: object } }

  /v1/projects/{project_id}/vertex-logging:
    get:
      tags: [Readiness]
      summary: Gemini Platform inference request metadata logging status for one managed project
      description: |
        Requires `usage:read` or `admin`. Reads v1beta1 `fetchPublisherModelConfig`. This log
        (`aiplatform.googleapis.com/inference_request`) is the only log-based source of Gemini Platform token counts.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/VertexLoggingStatus" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{project_id}/vertex-logging/enable:
    post:
      tags: [Readiness]
      summary: Enable Gemini Platform inference request metadata logging (project-wide)
      description: |
        Requires `admin`. Calls v1beta1 `setPublisherModelConfig` with `inferenceEventLoggingConfig.state=ENABLED`.
        Needs `aiplatform.endpoints.setPublisherModelConfig` on the project. Cloud Logging ingestion charges apply.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { dryRun: { type: boolean, default: false } } }
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/VertexLoggingStatus" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/vertex-logging/enable:
    post:
      tags: [Readiness]
      summary: Enable Gemini Platform inference request metadata logging on many managed projects
      description: Requires `admin`. `dryRun` defaults to true.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projects: { type: array, items: { type: string }, default: ["*"] }
                dryRun: { type: boolean, default: true }
      responses:
        "200":
          description: Per-project results
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [vertex_inference_logging_bulk] }
                  dry_run: { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/VertexLoggingStatus" } }
                  skipped_over_limit: { type: array, items: { type: string } }
                  unknown_projects: { type: array, items: { type: string } }

  /v1/operations:
    get:
      tags: [Operations]
      summary: List long-running governance operations
      description: Requires `models:read`, `quotas:read` or `caps:read`.
      parameters:
        - { name: kind, in: query, schema: { type: string }, example: model_access }
        - { name: status, in: query, schema: { type: string, enum: [propagating, succeeded, failed] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Operations }

  /v1/operations/{operation_id}:
    get:
      tags: [Operations]
      summary: Poll an operation (Org Policy / GE / IAM / quota propagation)
      description: Requires `models:read`, `quotas:read` or `caps:read`.
      parameters:
        - { name: operation_id, in: path, required: true, schema: { type: string, pattern: "^op_[0-9a-f]{16}$" } }
      responses:
        "200": { description: Operation, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from `next_cursor` }
    Start: { name: start, in: query, schema: { type: string, format: date } }
    End: { name: end, in: query, schema: { type: string, format: date } }
    ModelId: { name: model_id, in: path, required: true, schema: { type: string }, example: "<model-id>" }
    ScopeType: { name: scope_type, in: path, required: true, schema: { type: string, enum: [projects, folders, organizations] } }
    ScopeId: { name: scope_id, in: path, required: true, schema: { type: string }, example: team-a-prod }
    AppId: { name: app_id, in: path, required: true, schema: { type: string }, example: "my-project~global~corp-assistant" }
    Email: { name: email, in: path, required: true, schema: { type: string }, example: "alice%40company.com" }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    GroupId: { name: group_id, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }, example: eng-platform }
    LimitId: { name: limit_id, in: path, required: true, schema: { type: string, pattern: "^rl_[0-9a-f]{16}$" } }

  securitySchemes:
    BearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: "gcpai_<id>_<secret>"
    GoogleOidcBearer:
      type: http
      scheme: bearer
      bearerFormat: "JWT (RS256 Google OIDC)"

  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type: { type: string }
                  code: { type: string }
                  message: { type: string }

  schemas:
    Surface:
      type: string
      description: "AI surface. `vertex_ai` is accepted as a legacy alias of `gemini_platform`."
      enum: [antigravity, gemini_platform, gemini_enterprise]

    GroupInput:
      type: object
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: "Required on create; immutable" }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        priority: { type: integer, minimum: 0, maximum: 100000, default: 100, description: "Lower wins when a person is in several groups" }
        members: { type: array, items: { type: string }, description: "Emails or workforce principals" }
        excluded: { type: array, items: { type: string }, description: "Exceptions: never subject to the group policy" }
        google_group: { type: ["string", "null"], description: "Google Group email to sync members from (Cloud Identity)" }

    PeopleDelta:
      type: object
      properties:
        add: { type: array, items: { type: string } }
        remove: { type: array, items: { type: string } }

    Group:
      type: object
      properties:
        object: { type: string, enum: [group] }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priority: { type: integer }
        members: { type: array, items: { type: string } }
        google_group: { type: ["string", "null"] }
        synced_members: { type: array, items: { type: string } }
        synced_at: { type: ["string", "null"], format: date-time }
        sync_error: { type: ["string", "null"] }
        excluded: { type: array, items: { type: string } }
        effective_members: { type: array, items: { type: string }, description: "(members + synced_members) - excluded" }
        member_count: { type: integer }
        cap_rule: { oneOf: [{ $ref: "#/components/schemas/GroupCapRule" }, { type: "null" }] }
        block: { type: ["object", "null"] }
        model_rule: { type: ["object", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    GroupCapRule:
      type: object
      properties:
        type: { type: string, enum: [limit, allow, block], default: limit }
        pool: { type: string, enum: [per_member, shared], default: per_member }
        cost_cap: { type: ["number", "null"], minimum: 0 }
        token_cap: { type: ["integer", "null"], minimum: 0 }
        request_cap: { type: ["integer", "null"], minimum: 0 }
        scope: { type: ["string", "null"], enum: [total, per_project, null] }
        project_caps:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CapTriplet" }
