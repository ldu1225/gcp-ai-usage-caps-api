<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">GCP AI Usage &amp; Spend Caps API</title>
  <desc id="desc">Wordmark banner. Per-user, per-group and per-project AI usage, spend caps and enforcement for Antigravity, Gemini Platform and Gemini Enterprise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#102A4C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#4C8DF0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Abstract mark: usage bars under a cap line -->
  <g transform="translate(88,84)">
    <rect x="0" y="0" width="152" height="152" rx="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <rect x="26" y="92" width="18" height="38" rx="4" fill="url(#bar)"/>
    <rect x="54" y="70" width="18" height="60" rx="4" fill="url(#bar)"/>
    <rect x="82" y="52" width="18" height="78" rx="4" fill="url(#bar)"/>
    <rect x="110" y="44" width="18" height="86" rx="4" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="110" y="44" width="18" height="10" rx="3" fill="#FBBC04"/>
    <line x1="18" y1="40" x2="136" y2="40" stroke="#34A853" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <circle cx="136" cy="40" r="5" fill="#34A853"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="284" y="112" fill="#8AB4F8" font-size="15" font-weight="600" letter-spacing="3">HEADLESS GOVERNANCE API FOR GOOGLE CLOUD AI</text>
    <text x="282" y="166" fill="#FFFFFF" font-size="42" font-weight="700" letter-spacing="-0.5">GCP AI Usage &amp; Spend Caps API</text>
    <text x="284" y="206" fill="#E8EEF7" font-size="20" font-weight="500">Antigravity  |  Gemini Platform  |  Gemini Enterprise</text>
    <text x="284" y="242" fill="#AFC3DD" font-size="16" font-weight="400">Per-user, group and project usage, spend caps and enforcement from one hub</text>
  </g>

  <!-- Capability chips -->
  <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="1064" y="88" width="176" height="32" rx="16" fill="#1A73E8" fill-opacity="0.18" stroke="#1A73E8" stroke-width="1.5"/>
    <text x="1152" y="109" fill="#D2E3FC" text-anchor="middle">Usage and cost</text>
    <rect x="1064" y="132" width="176" height="32" rx="16" fill="#1A73E8" fill-opacity="0.18" stroke="#1A73E8" stroke-width="1.5"/>
    <text x="1152" y="153" fill="#D2E3FC" text-anchor="middle">Spend caps</text>
    <rect x="1064" y="176" width="176" height="32" rx="16" fill="#34A853" fill-opacity="0.16" stroke="#34A853" stroke-width="1.5"/>
    <text x="1152" y="197" fill="#CEEAD6" text-anchor="middle">IAM Deny enforcement</text>
    <rect x="1064" y="220" width="176" height="32" rx="16" fill="#FBBC04" fill-opacity="0.14" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="1152" y="241" fill="#FEEFC3" text-anchor="middle">Model governance</text>
  </g>

  <rect x="0" y="314" width="1280" height="6" fill="#1A73E8"/>
</svg>
